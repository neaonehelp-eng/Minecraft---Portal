<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Портал страны</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#14181d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Портал">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #14181d;
    background-image: radial-gradient(circle at 50% 0%, #1c222a 0%, #14181d 60%);
    color: #e9e4d8;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
    padding: 40px 16px 56px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  button, input, textarea { font-family: inherit; }
  button { cursor: pointer; }
  input, textarea { outline: none; }
  .wrap { width: 100%; max-width: 720px; }
  .header { text-align: center; margin-bottom: 4px; }
  .kicker { font-size: 12px; letter-spacing: 0.28em; color: #8a8f96; font-weight: 600; margin-bottom: 10px; }
  h1 { font-size: 32px; font-weight: 800; letter-spacing: 0.02em; color: #f4ede0; }
  .identity { margin-top: 16px; display: flex; align-items: center; gap: 8px; font-size: 12px; flex-direction: column; }
  .identity-note { font-size: 10px; color: #4a4e54; margin-top: 6px; text-align: center; max-width: 360px; }
  .toolbar { margin-top: 18px; margin-bottom: 24px; display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
  .ghost-btn { display: flex; align-items: center; gap: 6px; background: transparent; border: 1px solid #33393f; color: #8a8f96; border-radius: 8px; padding: 8px 13px; font-size: 13px; font-weight: 600; }
  .ghost-btn.active { background: rgba(232,163,61,0.12); border-color: rgba(232,163,61,0.4); color: #e8a33d; }
  .pin-input, .name-input, .text-input { background: #1c2128; border: 1px solid #33393f; border-radius: 8px; padding: 7px 10px; color: #e9e4d8; font-size: 13px; }
  .btn-primary { background: #e8a33d; border: none; border-radius: 8px; padding: 7px 12px; color: #14181d; font-weight: 700; font-size: 12px; }
  .btn-primary:disabled { background: #33393f; color: #6b7078; }
  .btn-danger { background: #c25b4a; border: none; border-radius: 8px; padding: 6px 10px; color: #fff; font-weight: 700; font-size: 12px; }
  .btn-save { background: #3f7a5c; border: none; border-radius: 8px; padding: 7px 14px; color: #fff; font-weight: 700; font-size: 12px; }
  .tabs { display: flex; gap: 4px; background: #181c22; border: 1px solid #262b32; border-radius: 12px; padding: 4px; margin-bottom: 22px; flex-wrap: wrap; justify-content: center; max-width: 100%; }
  .tab-btn { display: flex; align-items: center; gap: 7px; background: transparent; color: #8a8f96; border: none; border-radius: 9px; padding: 9px 16px; font-size: 13px; font-weight: 700; white-space: nowrap; }
  .tab-btn.active { background: #e8a33d; color: #14181d; }
  .card { background: linear-gradient(180deg, #1a1f26 0%, #16191f 100%); border: 1px solid #2a2f36; border-radius: 20px; box-shadow: 0 30px 60px -20px rgba(0,0,0,0.6); }
  .card-pad { padding: 24px 22px; }
  .section-label { padding: 16px 18px; border-bottom: 1px solid #262b32; font-size: 11px; color: #6b7078; font-weight: 700; display: flex; justify-content: space-between; align-items: center; }
  .row { display: flex; align-items: center; justify-content: space-between; padding: 16px 18px; border-bottom: 1px solid #21252b; gap: 12px; flex-wrap: wrap; }
  .row:last-child { border-bottom: none; }
  .badge { font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 6px; display: inline-flex; align-items: center; }
  .price-pill { background: #0f1216; border: 1px solid #262b32; border-radius: 8px; padding: 6px 12px; font-size: 18px; font-weight: 600; color: #e8a33d; font-family: ui-monospace, monospace; }
  .icon-btn { background: transparent; border: 1px solid #33393f; border-radius: 8px; padding: 6px; color: #8a8f96; display: inline-flex; align-items: center; justify-content: center; }
  .icon-btn.danger { color: #c25b4a; }
  .icon-btn.ok { color: #4caf7d; }
  textarea, input.wide { width: 100%; background: #0f1216; border: 1px solid #262b32; border-radius: 8px; padding: 9px 12px; color: #f4ede0; font-size: 14px; resize: vertical; }
  textarea:focus, input.wide:focus, input.edit-num:focus { border-color: #e8a33d; }
  .footer { margin-top: 22px; display: flex; align-items: center; gap: 8px; font-size: 12px; color: #5f646b; }
  .footer-note { font-size: 11px; color: #4a4e54; margin-top: 4px; text-align: center; }
  .empty { padding: 30px; text-align: center; color: #5f646b; font-size: 13px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 22px; }
  .ov-card { display: flex; align-items: center; gap: 12px; text-align: left; background: #0f1216; border: 1px solid #262b32; border-radius: 12px; padding: 14px 16px; }
  .ov-card.span { grid-column: 1 / -1; }
  .ov-ico { width: 34px; height: 34px; border-radius: 9px; background: rgba(232,163,61,0.12); display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 16px; }
  .ov-label { font-size: 11px; color: #6b7078; font-weight: 700; letter-spacing: 0.06em; }
  .ov-value { font-size: 13px; color: #e9e4d8; font-weight: 600; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  input.edit-num { width: 64px; background: #0f1216; border: 1px solid #e8a33d; border-radius: 8px; padding: 6px 8px; color: #f4ede0; font-size: 17px; font-family: ui-monospace, monospace; text-align: center; }
  .chat-box { display: flex; flex-direction: column; height: 460px; }
  .chat-msgs { flex: 1; overflow-y: auto; padding: 14px 18px; display: flex; flex-direction: column; gap: 10px; }
  .chat-input-row { padding: 12px 14px; border-top: 1px solid #262b32; display: flex; gap: 8px; }
  .news-media img, .news-media video { width: 100%; border-radius: 12px; margin-top: 12px; border: 1px solid #262b32; display: block; }
  .news-media iframe { width: 100%; aspect-ratio: 16/9; border-radius: 12px; margin-top: 12px; border: 1px solid #262b32; }
  .spin { display: inline-block; animation: spin 1s linear infinite; }
  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  ::-webkit-scrollbar { height: 6px; width: 6px; }
  ::-webkit-scrollbar-thumb { background: #33393f; border-radius: 3px; }
  .field-label { font-size: 11px; color: #8a8f96; font-weight: 700; display: block; margin-bottom: 6px; }
  .swatch { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
</style>
</head>
<body>
<div id="app" class="wrap"></div>

<script>
// ============== КОНФИГУРАЦИЯ ==============
var ADMIN_PIN = "1937";
var JSONBLOB_API = "https://jsonblob.com/api/jsonBlob";
var MAX_HISTORY = 20, MAX_CHAT = 100, MAX_REPORTS = 60, MAX_NEWS = 40;
var DEFAULT_COLOR = "#8a8f96";
var POLL_MS = 8000;

var DEFAULT_STATE = {
  announcement: { text: "Добро пожаловать на портал. Здесь собраны все главные документы страны: цены на лечение, курс обмена ресурсов, информация о военных сборах, общий чат и список жителей." },
  hospital: [
    { id: "hunger", label: "Голод", price: 10, category: "paid" },
    { id: "drown", label: "Утопление", price: 10, category: "paid" },
    { id: "void", label: "Падение в пустоту", price: 30, category: "paid" },
    { id: "pvp", label: "PvP", price: 20, category: "free" },
    { id: "lava", label: "Смерть в лаве", price: 30, category: "free" },
    { id: "mob", label: "Убит мобом", price: 10, category: "free" },
    { id: "explosion", label: "Взрыв", price: 20, category: "free" },
    { id: "lightning", label: "Удар молнии", price: 10, category: "free" },
    { id: "fall", label: "Падение с высоты", price: 10, category: "free" }
  ],
  exchange: [
    { id: "gold", label: "ЗОЛОТО", unit: "1 слиток", buy: 2, sell: 3 },
    { id: "emerald", label: "ИЗУМРУД", unit: "1 кристалл", buy: 6, sell: 8 },
    { id: "diamond", label: "АЛМАЗ", unit: "1 кристалл", buy: 20, sell: 25 }
  ],
  army: {
    nextGathering: "Дата следующего сбора пока не назначена",
    note: "Срок службы — 100 дней Minecraft (игровых суток). Считаются не календарные дни, а именно игровое время: сборы проходят совместно — все собираются в оговорённое время и играют вместе, пока не наберётся 100 игровых дней в сумме. Между сборами — обычная жизнь: работа, фермерство, торговля."
  },
  players: [], chat: [], reports: [], news: [], history: [], updatedAt: null
};

// ============== СОСТОЯНИЕ ==============
var state = JSON.parse(JSON.stringify(DEFAULT_STATE));
var blobId = null;
var loading = true, saving = false;
var tab = "overview";
var unlocked = false, showPinBox = false, pinError = "";
var showHistory = false, confirmReset = false, copied = false;
var editKey = null, draft = "";
var showNewsForm = false;
var editingAnnouncement = false;
var editingArmy = false, armyDraft = { nextGathering: "", note: "" };
var editingPlayer = null, playerRankDraft = "", playerColorDraft = DEFAULT_COLOR;
var newsTitle = "", newsText = "", newsImageUrl = "", newsVideoUrl = "";
var myName = localStorage.getItem("portal-nickname") || null;
var nameError = "", nameSaving = false;
var deferredInstallPrompt = null;

// ============== ХРАНИЛИЩЕ (JSONBlob, без регистрации) ==============
function getBlobIdFromUrl() {
  var h = window.location.hash;
  var m = h.match(/data=([a-zA-Z0-9]+)/);
  return m ? m[1] : null;
}

function ensureBlob(cb) {
  blobId = getBlobIdFromUrl();
  if (blobId) { cb(); return; }
  fetch(JSONBLOB_API, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(DEFAULT_STATE)
  }).then(function (res) {
    var loc = res.headers.get("Location") || "";
    var id = loc.split("/").pop();
    blobId = id;
    window.location.hash = "data=" + id;
    cb();
  }).catch(function (e) {
    console.error("Не удалось создать хранилище", e);
    loading = false;
    render();
  });
}

function loadState(silent, cb) {
  if (!blobId) { if (cb) cb(); return; }
  fetch(JSONBLOB_API + "/" + blobId)
    .then(function (r) { return r.json(); })
    .then(function (data) {
      state = Object.assign({}, DEFAULT_STATE, data);
      loading = false;
      render();
      if (cb) cb();
    })
    .catch(function (e) {
      console.error("Не удалось загрузить портал", e);
      loading = false;
      render();
    });
}

function persist(nextState, cb) {
  saving = true; render();
  nextState.updatedAt = new Date().toISOString();
  fetch(JSONBLOB_API + "/" + blobId, {
    method: "PUT",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(nextState)
  }).then(function () {
    state = nextState;
    saving = false;
    render();
    if (cb) cb();
  }).catch(function (e) {
    console.error("Не удалось сохранить", e);
    saving = false;
    render();
  });
}

function pushHistory(entry) {
  entry.time = new Date().toISOString();
  return [entry].concat(state.history).slice(0, MAX_HISTORY);
}

// ============== УТИЛИТЫ ==============
function esc(s) {
  var d = document.createElement("div");
  d.textContent = s == null ? "" : String(s);
  return d.innerHTML;
}
function formatTime(iso) {
  if (!iso) return "ещё не обновлялось";
  var d = new Date(iso);
  return d.toLocaleString("ru-RU", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
}
function getPlayer(nick) {
  var lower = (nick || "").toLowerCase();
  for (var i = 0; i < state.players.length; i++) if (state.players[i].nickname.toLowerCase() === lower) return state.players[i];
  return null;
}
function getYoutubeEmbed(url) {
  if (!url) return null;
  var m = url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([a-zA-Z0-9_-]{6,})/);
  return m ? ("https://www.youtube.com/embed/" + m[1]) : null;
}
function trendBadge(current, prev) {
  if (prev === undefined || prev === null) return "";
  var diff = current - prev;
  if (diff === 0) return '<div style="display:flex;align-items:center;gap:3px;color:#5f646b;font-size:11px;font-weight:600;">–</div>';
  var isUp = diff > 0;
  var color = isUp ? "#4caf7d" : "#e0594a";
  var bg = isUp ? "rgba(76,175,125,0.12)" : "rgba(224,89,74,0.12)";
  var pct = prev !== 0 ? Math.round((diff / prev) * 100) : 0;
  return '<div style="display:flex;align-items:center;gap:3px;color:' + color + ';background:' + bg + ';border-radius:6px;padding:3px 6px;font-size:11px;font-weight:700;white-space:nowrap;">' +
    (isUp ? "▲" : "▼") + " " + Math.abs(diff) + " · " + (isUp ? "+" : "") + pct + "%</div>";
}
function rankBadge(rank, color) {
  var c = color || DEFAULT_COLOR;
  return '<span class="badge" style="color:' + c + ';background:' + c + '22;border:1px solid ' + c + '55;">' + esc(rank || "Гражданин") + '</span>';
}

// ============== ДЕЙСТВИЯ ==============
function tryUnlock() {
  var val = document.getElementById("pinInputEl") ? document.getElementById("pinInputEl").value : "";
  if (val === ADMIN_PIN) { unlocked = true; showPinBox = false; pinError = ""; }
  else { pinError = "err"; }
  render();
}
function copyLink() {
  navigator.clipboard.writeText(window.location.href).then(function () {
    copied = true; render();
    setTimeout(function () { copied = false; render(); }, 1800);
  }).catch(function () {});
}

function confirmName() {
  var val = document.getElementById("nameInputEl") ? document.getElementById("nameInputEl").value.trim().slice(0, 24) : "";
  if (!val) { nameError = "Введите ник"; render(); return; }
  nameError = ""; nameSaving = true; render();
  localStorage.setItem("portal-nickname", val);
  myName = val;
  var exists = state.players.some(function (p) { return p.nickname.toLowerCase() === val.toLowerCase(); });
  if (!exists) {
    var nextPlayers = state.players.concat([{ nickname: val, rank: "Гражданин", color: DEFAULT_COLOR, firstSeen: new Date().toISOString() }]);
    persist(Object.assign({}, state, { players: nextPlayers }), function () { nameSaving = false; render(); });
  } else { nameSaving = false; render(); }
}
function forgetName() {
  localStorage.removeItem("portal-nickname");
  myName = null; render();
}

function startEditHospital(id) { editKey = "hospital:" + id; var item = state.hospital.find(function (h) { return h.id === id; }); draft = String(item.price); render(); }
function confirmEditHospital(id) {
  var num = parseInt(draft, 10);
  if (isNaN(num) || num < 0) { editKey = null; render(); return; }
  var item = state.hospital.find(function (h) { return h.id === id; });
  var nextHospital = state.hospital.map(function (h) { return h.id === id ? Object.assign({}, h, { prevPrice: h.price, price: num }) : h; });
  var nextHistory = num !== item.price ? pushHistory({ section: "Больница", label: item.label, field: "Цена", from: item.price, to: num }) : state.history;
  editKey = null;
  persist(Object.assign({}, state, { hospital: nextHospital, history: nextHistory }));
}

function startEditExchange(id, field) { editKey = "exchange:" + id + ":" + field; var item = state.exchange.find(function (e) { return e.id === id; }); draft = String(field === "buy" ? item.buy : item.sell); render(); }
function confirmEditExchange(id, field) {
  var num = parseInt(draft, 10);
  if (isNaN(num) || num < 0) { editKey = null; render(); return; }
  var item = state.exchange.find(function (e) { return e.id === id; });
  var oldVal = field === "buy" ? item.buy : item.sell;
  var nextExchange = state.exchange.map(function (e) {
    if (e.id !== id) return e;
    if (field === "buy") return Object.assign({}, e, { prevBuy: e.buy, buy: num });
    return Object.assign({}, e, { prevSell: e.sell, sell: num });
  });
  var nextHistory = num !== oldVal ? pushHistory({ section: "Курс валют", label: item.label, field: field === "buy" ? "Покупка" : "Продажа", from: oldVal, to: num }) : state.history;
  editKey = null;
  persist(Object.assign({}, state, { exchange: nextExchange, history: nextHistory }));
}

function startEditAnnouncement() { editingAnnouncement = true; render(); }
function confirmAnnouncement() {
  var val = document.getElementById("annTextEl").value;
  var nextHistory = val !== state.announcement.text ? pushHistory({ section: "Объявление", label: "Главная страница", field: "Текст", from: "—", to: "обновлено" }) : state.history;
  editingAnnouncement = false;
  persist(Object.assign({}, state, { announcement: { text: val }, history: nextHistory }));
}

function startEditArmy() { armyDraft = Object.assign({}, state.army); editingArmy = true; render(); }
function confirmArmy() {
  var nextGathering = document.getElementById("armyDateEl").value;
  var note = document.getElementById("armyNoteEl").value;
  var nextHistory = nextGathering !== state.army.nextGathering ? pushHistory({ section: "Армия", label: "Дата сбора", field: "Обновлено", from: state.army.nextGathering, to: nextGathering }) : state.history;
  editingArmy = false;
  persist(Object.assign({}, state, { army: { nextGathering: nextGathering, note: note }, history: nextHistory }));
}

function sendChat() {
  var el = document.getElementById("chatInputEl");
  var text = el ? el.value.trim() : "";
  if (!text || !myName) return;
  var msg = { id: Date.now() + "-" + Math.random().toString(36).slice(2, 7), nickname: myName, text: text.slice(0, 500), time: new Date().toISOString() };
  var nextChat = state.chat.concat([msg]).slice(-MAX_CHAT);
  persist(Object.assign({}, state, { chat: nextChat }), function () {
    var box = document.getElementById("chatMsgsEl");
    if (box) box.scrollTop = box.scrollHeight;
  });
}

function startEditPlayer(nick) {
  var p = getPlayer(nick);
  editingPlayer = nick; playerRankDraft = p.rank || "Гражданин"; playerColorDraft = p.color || DEFAULT_COLOR; render();
}
function confirmEditPlayer(nick) {
  var rankVal = document.getElementById("prankEl").value;
  var colorVal = document.getElementById("pcolorEl").value;
  var player = getPlayer(nick);
  var nextPlayers = state.players.map(function (p) { return p.nickname === nick ? Object.assign({}, p, { rank: rankVal.trim() || "Гражданин", color: colorVal }) : p; });
  var nextHistory = (player.rank !== rankVal || player.color !== colorVal) ? pushHistory({ section: "Жители", label: nick, field: "Статус", from: player.rank, to: rankVal.trim() || "Гражданин" }) : state.history;
  editingPlayer = null;
  persist(Object.assign({}, state, { players: nextPlayers, history: nextHistory }));
}
function addManualPlayer() {
  var name = prompt("Игровой ник жителя:");
  if (!name || !name.trim()) return;
  var trimmed = name.trim().slice(0, 24);
  if (state.players.some(function (p) { return p.nickname.toLowerCase() === trimmed.toLowerCase(); })) return;
  var nextPlayers = state.players.concat([{ nickname: trimmed, rank: "Гражданин", color: DEFAULT_COLOR, firstSeen: new Date().toISOString() }]);
  persist(Object.assign({}, state, { players: nextPlayers }));
}
function removePlayer(nick) {
  var nextPlayers = state.players.filter(function (p) { return p.nickname !== nick; });
  var nextHistory = pushHistory({ section: "Жители", label: nick, field: "Удалён", from: "—", to: "—" });
  persist(Object.assign({}, state, { players: nextPlayers, history: nextHistory }));
}

function submitReport() {
  var target = document.getElementById("reportTargetEl").value.trim();
  var text = document.getElementById("reportTextEl").value.trim();
  if (!target || !text) return;
  var report = { id: Date.now() + "-" + Math.random().toString(36).slice(2, 7), target: target.slice(0, 24), text: text.slice(0, 600), reporter: myName || "Аноним", status: "new", time: new Date().toISOString() };
  var nextReports = [report].concat(state.reports).slice(0, MAX_REPORTS);
  var nextHistory = pushHistory({ section: "Заявления", label: target, field: "Новое заявление", from: "—", to: "подано" });
  persist(Object.assign({}, state, { reports: nextReports, history: nextHistory }));
}
function resolveReport(id) {
  var nextReports = state.reports.map(function (r) { return r.id === id ? Object.assign({}, r, { status: r.status === "resolved" ? "new" : "resolved" }) : r; });
  persist(Object.assign({}, state, { reports: nextReports }));
}
function deleteReport(id) {
  var nextReports = state.reports.filter(function (r) { return r.id !== id; });
  persist(Object.assign({}, state, { reports: nextReports }));
}

function submitNews() {
  var title = document.getElementById("newsTitleEl").value.trim();
  var text = document.getElementById("newsTextEl").value.trim();
  var img = document.getElementById("newsImgEl").value.trim();
  var vid = document.getElementById("newsVidEl").value.trim();
  if (!title) return;
  var post = { id: Date.now() + "-" + Math.random().toString(36).slice(2, 7), title: title.slice(0, 80), text: text.slice(0, 1000), imageUrl: img.slice(0, 500), videoUrl: vid.slice(0, 500), time: new Date().toISOString() };
  var nextNews = [post].concat(state.news).slice(0, MAX_NEWS);
  var nextHistory = pushHistory({ section: "Новости", label: title, field: "Опубликовано", from: "—", to: "—" });
  showNewsForm = false;
  persist(Object.assign({}, state, { news: nextNews, history: nextHistory }));
}
function deleteNews(id) {
  var post = state.news.find(function (n) { return n.id === id; });
  var nextNews = state.news.filter(function (n) { return n.id !== id; });
  var nextHistory = post ? pushHistory({ section: "Новости", label: post.title, field: "Удалено", from: "—", to: "—" }) : state.history;
  persist(Object.assign({}, state, { news: nextNews, history: nextHistory }));
}

function doReset() {

    state.history.forEach(function (h) {
      html += '<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #21252b;font-size:13px;gap:10px;flex-wrap:wrap;">' +
        '<div style="color:#c9cdd2;"><span style="color:#e8a33d;font-weight:700;">' + esc(h.section) + '</span> <span style="font-weight:700;">' + esc(h.label) + '</span> <span style="color:#6b7078;">· ' + esc(h.field) + '</span></div>' +
        '<div style="display:flex;align-items:center;gap:8px;"><span style="color:#6b7078;">' + esc(h.from) + ' → ' + esc(h.to) + '</span><span style="color:#4a4f56;font-size:11px;">' + formatTime(h.time) + '</span></div></div>';
    });
  }
  html += '</div>';
  return html;
}

function renderFooter() {
  return '<div class="footer">' + (saving ? '<span class="spin">↻</span> Сохранение…' : 'Последнее обновление: ' + formatTime(state.updatedAt)) + '</div>' +
    '<div class="footer-note">Портал виден всем жителям · изменять может только держатель PIN-кода</div>';
}

// ============== ПРИВЯЗКА СОБЫТИЙ ==============
function on(id, evt, fn) { var el = document.getElementById(id); if (el) el.addEventListener(evt, fn); }
function onAll(cls, evt, fn) { document.querySelectorAll("." + cls).forEach(function (el) { el.addEventListener(evt, fn); }); }

function bindEvents() {
  onAll("tab-link", "click", function (e) { setTab(e.currentTarget.getAttribute("data-tab")); });

  on("nameConfirmBtn", "click", confirmName);
  on("nameInputEl", "keydown", function (e) { if (e.key === "Enter" && !nameSaving) confirmName(); });
  on("forgetNameBtn", "click", forgetName);

  on("showPinBtn", "click", function () { showPinBox = true; render(); var el = document.getElementById("pinInputEl"); if (el) el.focus(); });
  on("pinConfirmBtn", "click", tryUnlock);
  on("pinInputEl", "keydown", function (e) { if (e.key === "Enter") tryUnlock(); });
  on("pinCancelBtn", "click", function () { showPinBox = false; pinError = ""; render(); });
  on("lockBtn", "click", function () { unlocked = false; render(); });
  on("historyBtn", "click", function () { showHistory = !showHistory; render(); });
  on("copyLinkBtn", "click", copyLink);
  on("resetBtn", "click", function () { confirmReset = true; render(); });
  on("resetYesBtn", "click", doReset);
  on("resetNoBtn", "click", function () { confirmReset = false; render(); });

  on("editAnnBtn", "click", startEditAnnouncement);
  on("annSaveBtn", "click", confirmAnnouncement);
  on("annCancelBtn", "click", function () { editingAnnouncement = false; render(); });

  onAll("hosp-edit-btn", "click", function (e) { startEditHospital(e.currentTarget.getAttribute("data-id")); });
  onAll("exch-edit-btn", "click", function (e) { startEditExchange(e.currentTarget.getAttribute("data-id"), e.currentTarget.getAttribute("data-field")); });
  on("editConfirmBtn", "click", function (e) {
    draft = document.getElementById("editNumEl").value;
    var kind = e.currentTarget.getAttribute("data-kind"), id = e.currentTarget.getAttribute("data-id");
    if (kind === "hospital") confirmEditHospital(id);
    else confirmEditExchange(id, e.currentTarget.getAttribute("data-field"));
  });
  on("editCancelBtn", "click", function () { editKey = null; render(); });
  var editNumEl = document.getElementById("editNumEl");
  if (editNumEl) editNumEl.addEventListener("keydown", function (e) {
    if (e.key === "Enter") document.getElementById("editConfirmBtn").click();
    if (e.key === "Escape") { editKey = null; render(); }
  });

  on("editArmyBtn", "click", startEditArmy);
  on("armySaveBtn", "click", confirmArmy);
  on("armyCancelBtn", "click", function () { editingArmy = false; render(); });

  on("chatSendBtn", "click", sendChat);
  on("chatInputEl", "keydown", function (e) { if (e.key === "Enter") sendChat(); });
  var chatBox = document.getElementById("chatMsgsEl");
  if (chatBox) chatBox.scrollTop = chatBox.scrollHeight;

  on("addPlayerBtn", "click", addManualPlayer);
  onAll("player-edit-btn", "click", function (e) { startEditPlayer(e.currentTarget.getAttribute("data-nick")); });
  onAll("player-del-btn", "click", function (e) { removePlayer(e.currentTarget.getAttribute("data-nick")); });
  onAll("player-save-btn", "click", function (e) { confirmEditPlayer(e.currentTarget.getAttribute("data-nick")); });
  on("playerCancelBtn", "click", function () { editingPlayer = null; render(); });

  on("reportSubmitBtn", "click", submitReport);
  onAll("report-resolve-btn", "click", function (e) { resolveReport(e.currentTarget.getAttribute("data-id")); });
  onAll("report-del-btn", "click", function (e) { deleteReport(e.currentTarget.getAttribute("data-id")); });

  on("newsAddBtn", "click", function () { showNewsForm = true; render(); });
  on("newsSubmitBtn", "click", submitNews);
  on("newsCancelBtn", "click", function () { showNewsForm = false; render(); });
  onAll("news-del-btn", "click", function (e) { deleteNews(e.currentTarget.getAttribute("data-id")); });

  on("installBtn", "click", function () {
    if (!deferredInstallPrompt) return;
    deferredInstallPrompt.prompt();
    deferredInstallPrompt.userChoice.then(function () { deferredInstallPrompt = null; render(); });
  });
}

// ============== УСТАНОВКА КАК ПРИЛОЖЕНИЕ ==============
window.addEventListener("beforeinstallprompt", function (e) {
  e.preventDefault();
  deferredInstallPrompt = e;
  render();
});
window.addEventListener("appinstalled", function () {
  deferredInstallPrompt = null;
  render();
});

// ============== SERVICE WORKER (офлайн-каркас + установка) ==============
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("sw.js").catch(function (e) {
      console.error("Service worker не зарегистрирован", e);
    });
  });
}

// ============== СТАРТ ==============
render();
ensureBlob(function () {
  loadState(false);
  setInterval(function () { loadState(true); }, POLL_MS);
});
</script>
</body>
</html>
